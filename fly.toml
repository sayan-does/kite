# Fly.io — always-on single machine so APScheduler fires once.
#   fly launch --no-deploy --copy-config
#   fly secrets set ...
#   fly deploy
app = "kite-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PREFILL_ON_STARTUP = "false"
  ENABLE_SCHEDULER = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
