# LEVEL 1 - Quality gate. Fast, no secrets, runs on every PR / branch push.
# Also reusable: deploy.yml calls it (workflow_call) so main can never ship unverified.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b && vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_BASE_URL: https://api.example.com

  backend:
    name: Backend (pytest, hermetic tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role
      SUPABASE_JWT_SECRET: test-jwt-secret
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      GROQ_API_KEY: test-groq
      YOUTUBE_API_KEY: test-youtube
      EMAIL_API_KEY: test-email
      SEARX_URL: https://searx.example
      PREFILL_ON_STARTUP: "false"
      ENABLE_SCHEDULER: "false"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import app.main; print('import ok')"
      # Integration tests need a real Supabase; they run nightly against staging (nightly.yml).
      - run: pytest -q -m "not integration" --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          retention-days: 7

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: kite-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security (secrets + dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (fails on high/critical, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (advisory)
        continue-on-error: true # advisory until the baseline is clean; flip to blocking later
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  # Single required status check for branch protection.
  ci-gate:
    name: CI gate
    if: always()
    needs: [frontend, backend, docker, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
